# =============================================================================
# Docker Compose: Local Demonstration Service for Northstar SaaS Dashboard
# =============================================================================

services:
  northstar-churn-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: northstar-churn-dashboard:latest
    container_name: northstar_saas_dashboard
    restart: unless-stopped
    ports:
      # Map host port 8501 to container port 8501.
      # To override host port if 8501 is busy: HOST_PORT=8502 docker compose up
      - "${HOST_PORT:-8501}:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - APP_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
